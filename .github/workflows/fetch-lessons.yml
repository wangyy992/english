name: Fetch daily study material

on:
  schedule:
    - cron: '30 5 * * *' # daily, ~13:30 Beijing time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_lessons.py'
      - 'scripts/fetch_canto.py'
      - 'scripts/fetch_articles.py'
      - '.github/workflows/fetch-lessons.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fetch-lessons
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      # Always operate on main: scheduled runs otherwise check out the
      # repository default branch, which is not main in this repo.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install transcription dependencies
        run: pip install faster-whisper
      - name: Fetch and transcribe new podcast episodes
        run: python scripts/fetch_lessons.py
      - name: Fetch and transcribe Cantonese broadcast episodes
        run: python scripts/fetch_canto.py || echo "[warn] canto fetch failed, continuing"
      - name: Fetch new reading articles
        run: python scripts/fetch_articles.py
      - name: Commit new material
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/lessons.json public/data/articles.json public/data/canto-lessons.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: add new study material from feeds"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushing with GITHUB_TOKEN doesn't trigger deploy.yml, so build and
      # deploy here whenever the material changed (or on manual dispatch).
      - uses: actions/setup-node@v4
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        with:
          node-version: 20
      - name: Build
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          npm install
          npm run build
      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
